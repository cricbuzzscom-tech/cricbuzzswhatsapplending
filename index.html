<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Cricbuzzs</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 20px 12px;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: auto;
}

.poster {
    width: 100%;
    display: block;
    border-radius: 12px;
    margin-bottom: 20px;
}

.whatsapp-btn {
    display: block;
    width: 100%;
    background: #25D366;
    color: #ffffff;
    text-decoration: none;
    font-size: 19px;
    font-weight: bold;
    padding: 17px 15px;
    border-radius: 10px;
    margin-bottom: 22px;
    transition: 0.2s;
}

.whatsapp-btn:hover {
    background: #1ebe5d;
}

.disclaimer {
    color: #bbbbbb;
    font-size: 12px;
    line-height: 1.8;
    padding: 10px 5px;
}

.disclaimer strong {
    color: #ff4444;
    font-size: 14px;
}

.footer {
    margin-top: 12px;
    color: #777777;
    font-size: 11px;
}
</style>

<!-- Meta Pixel Code -->
<script>
